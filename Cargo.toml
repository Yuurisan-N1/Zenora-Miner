[package]
name = "zenora-miner-bot"
version = "1.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[[bin]]
name = "zenora-miner-bot"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "socks", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2" }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
p256 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
base64 = "0.22"
rand = "0.8"
chrono = "0.4"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
